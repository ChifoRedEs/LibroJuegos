<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LibroJuegos</title>
<meta name="description" content="Biblioteca de aventuras de texto interactivas.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Alegreya+Sans:wght@400;500;700&family=Ma+Shan+Zheng&family=Uncial+Antiqua&family=Noto+Sans+Runic&display=swap">
<style>
:root{
  --fondo:#141a2e;      /* noche índigo */
  --fondo2:#1b2340;
  --texto:#ece4d2;      /* papel */
  --tenue:#9298ad;
  --oro:#c9a75b;        /* dorado de encuadernación */
  --papel:#e9dfc8;
  --linea:#2c3558;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --fondo:#efe9dd;--fondo2:#e5ddcc;--texto:#1d2238;--tenue:#5d6278;
    --oro:#8a6a24;--papel:#fbf7ee;--linea:#cfc5ae;
  }
}
:root[data-theme="dark"]{--fondo:#141a2e;--fondo2:#1b2340;--texto:#ece4d2;--tenue:#9298ad;--oro:#c9a75b;--papel:#e9dfc8;--linea:#2c3558}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100%;
  background:
    radial-gradient(900px 420px at 50% -8%,color-mix(in srgb,var(--oro) 14%,transparent),transparent 70%),
    var(--fondo);
  color:var(--texto);
  font:400 1.0625rem/1.6 "Alegreya Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:1040px;margin:0 auto;padding:0 clamp(18px,4vw,40px) 64px}

/* ---------- Cabecera ---------- */
header{text-align:center;padding:clamp(48px,11vh,110px) 0 clamp(36px,7vh,64px)}
h1{
  margin:0;
  font:600 clamp(3.2rem,11vw,6.6rem)/.95 "Cormorant Garamond",Georgia,serif;
  letter-spacing:-.01em;
  color:var(--texto);
}
.filete{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin:22px auto 18px;max-width:340px;color:var(--oro);
}
.filete::before,.filete::after{content:"";flex:1;height:1px;background:currentColor;opacity:.6}
.filete svg{width:18px;height:18px;flex:none}
.lema{
  margin:0 auto;max-width:34ch;
  font:italic 500 clamp(1.15rem,2.6vw,1.4rem)/1.45 "Cormorant Garamond",Georgia,serif;
  color:var(--tenue);
}

/* ---------- Estantería ---------- */
.estante{
  list-style:none;margin:0;padding:0;
  display:grid;gap:clamp(36px,5vw,56px) clamp(24px,4vw,44px);
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
}
.estante>li{display:flex}
.libro{
  display:flex;flex-direction:column;width:100%;
  color:inherit;text-decoration:none;border-radius:6px;
}
.libro:focus-visible{outline:2px solid var(--oro);outline-offset:8px}

/* Volumen 3D: hojas detrás, tapa delante */
.volumen{position:relative;aspect-ratio:2/3;perspective:1400px;margin-bottom:22px}
.volumen::before{ /* bloque de hojas */
  content:"";position:absolute;inset:3% 0 3% 4%;
  border-radius:2px 5px 5px 2px;
  background:repeating-linear-gradient(90deg,var(--papel) 0 2px,color-mix(in srgb,var(--papel) 82%,#000) 2px 3px);
  box-shadow:0 18px 30px -14px rgba(0,0,0,.55);
}
.volumen::after{ /* sombra en la balda */
  content:"";position:absolute;left:6%;right:2%;bottom:-14px;height:14px;
  background:radial-gradient(closest-side,rgba(0,0,0,.4),transparent);
}
.tapa{
  --c:#2f4a6b;
  position:absolute;inset:0;
  border-radius:3px 7px 7px 3px;
  background:
    linear-gradient(115deg,rgba(255,255,255,.10),transparent 40%),
    radial-gradient(120% 80% at 70% 20%,color-mix(in srgb,var(--c) 70%,#fff 10%),var(--c) 60%,color-mix(in srgb,var(--c) 70%,#000));
  color:#f1e6c8;
  transform-origin:left center;
  transition:transform .55s cubic-bezier(.2,.7,.2,1),box-shadow .55s;
  box-shadow:0 22px 34px -16px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.06);
  overflow:hidden;
}
.tapa .portada{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lomo{
  position:absolute;left:0;top:0;bottom:0;width:9%;
  background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,.12) 70%,rgba(255,255,255,.12));
}
.marco{
  position:absolute;inset:7% 7% 7% 15%;
  border:1px solid color-mix(in srgb,#e2c27a 70%,transparent);
  outline:1px solid color-mix(in srgb,#e2c27a 35%,transparent);outline-offset:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:10% 8%;gap:8%;
}
.emblema{
  font:400 clamp(3rem,9vw,4.4rem)/1 "Ma Shan Zheng","Noto Sans Runic","Cormorant Garamond",serif;
  color:#e2c27a;text-shadow:0 2px 0 rgba(0,0,0,.25);
}
.t-titulo{
  font:600 clamp(1.15rem,2.4vw,1.4rem)/1.15 "Cormorant Garamond",Georgia,serif;
  color:#f3e7c6;text-wrap:balance;
}
.t-sub{font:italic 500 .95rem/1.3 "Cormorant Garamond",Georgia,serif;color:#e2c27a;opacity:.85}

.libro:hover .tapa,.libro:focus-visible .tapa{
  transform:rotateY(-22deg);
  box-shadow:14px 22px 34px -14px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.06);
}

/* Ficha bajo el libro */
.ficha h2{margin:0 0 6px;font:600 1.45rem/1.15 "Cormorant Garamond",Georgia,serif}
.ficha .genero{margin:0 0 8px;color:var(--oro);font-weight:500;font-size:.95rem}
.ficha .resumen{margin:0 0 12px;color:var(--tenue);font-size:.98rem;max-width:42ch}
.estado{
  display:inline-flex;align-items:center;gap:8px;margin:0;
  font-size:.9rem;font-weight:500;color:var(--texto);
}
.estado::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid var(--tenue)}
.estado.en-curso::before{background:var(--oro);border-color:var(--oro)}

/* En preparación */
.libro.inactivo{cursor:default}
.libro.inactivo .tapa{filter:grayscale(.85) brightness(.75)}
.libro.inactivo .ficha h2,.libro.inactivo .ficha .genero{color:var(--tenue)}

.vacio{text-align:center;color:var(--tenue);padding:40px 0}

footer{
  margin-top:clamp(56px,9vh,96px);padding-top:22px;border-top:1px solid var(--linea);
  text-align:center;color:var(--tenue);font-size:.9rem;
}

/* Entrada: los libros se colocan en la estantería una sola vez */
@keyframes colocar{from{opacity:0;transform:translateY(18px)}}
.estante>li{animation:colocar .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 90ms + 150ms)}
@media (prefers-reduced-motion:reduce){
  .estante>li{animation:none}
  .tapa{transition:none}
  .libro:hover .tapa,.libro:focus-visible .tapa{transform:none}
}
@media (max-width:480px){
  .estante{grid-template-columns:repeat(2,1fr);gap:32px 18px}
  .ficha h2{font-size:1.2rem}
  .ficha .resumen{font-size:.92rem}
}
</style>
</head>
<body>
<main>
  <header>
    <h1>LibroJuegos</h1>
    <div class="filete" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>
    </div>
    <p class="lema">Elige una historia. Tus decisiones escriben el resto.</p>
  </header>

  <ul class="estante" id="estante" aria-label="Historias disponibles"></ul>

  <footer>Tus partidas se guardan en este navegador.</footer>
</main>

<script>
/* ============================================================
   CATÁLOGO DE LIBROJUEGOS
   Para añadir una historia nueva:
   1. Crea su carpeta junto a "Camino-Dao" (p. ej. "La-Torre-Hueca/index.html").
   2. Copia un bloque de abajo y cambia los datos.
   Campos:
     carpeta     → nombre exacto de la carpeta (se abre carpeta/index.html)
     titulo      → título en la portada y en la ficha
     subtitulo   → línea pequeña bajo el título de la portada (opcional)
     genero      → texto corto bajo el título de la ficha
     resumen     → una o dos frases
     emblema     → símbolo grande de la portada (un carácter o emoji)
     color       → color de la tapa (hex)
     portada     → imagen opcional, ruta relativa (sustituye al diseño de tapa)
     guardado    → clave de localStorage de la partida (opcional)
     progreso    → función que recibe la partida guardada y devuelve un texto (opcional)
     proximamente→ true para mostrarla en la estantería sin enlace
   ============================================================ */
const LIBROS = [
  {
    carpeta: 'Camino-Dao',
    titulo: 'El Camino del Dao',
    subtitulo: 'Temporada 1',
    genero: 'Fantasía Wuxia',
    resumen: 'Un aspirante sin talento, una espada de bambú habitada por un antiguo maestro y una secta que no te esperaba. Cultiva tu qi, caza, forja y sobrevive al examen.',
    emblema: '氣',
    color: '#24564a',
    guardado: 'camino-dao-v1',
    progreso: s => s && s.dia ? `Partida en curso: día ${s.dia}` : 'Partida en curso'
  },
  {
    carpeta: 'Senda-Valhalla',
    titulo: 'La Senda al Valhalla',
    subtitulo: 'Temporada 1',
    genero: 'Mitología nórdica',
    resumen: 'Ibas a morir en la cama, lejos del salón de Odín. Una valquiria te ofrece un invierno para ganarte el Valhalla antes del Ragnarok: runas, forja enana y las pruebas de los dioses.',
    emblema: 'ᛉ',
    color: '#2b4458',
    guardado: 'senda-valhalla-v1',
    progreso: s => s && s.nom ? `Partida en curso: ${s.nom}, día ${s.dia}` : 'Partida en curso',
  },
  // {
  //   carpeta: 'Otra-Historia',
  //   titulo: 'Título de la nueva historia',
  //   subtitulo: 'Libro 1',
  //   genero: 'Misterio',
  //   resumen: 'Breve descripción.',
  //   emblema: '✦',
  //   color: '#5a2b3a',
  //   proximamente: true
  // },
];

function leerPartida(clave){
  if(!clave) return null;
  try{
    const s = localStorage.getItem(clave);
    return s ? JSON.parse(s) : null;
  }catch(e){ return null; }
}

function esc(t){
  return String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function pintar(){
  const estante = document.getElementById('estante');
  if(!LIBROS.length){
    estante.outerHTML = '<p class="vacio">Aún no hay historias. Añade la primera en el catálogo de este archivo.</p>';
    return;
  }
  estante.innerHTML = LIBROS.map((l, i) => {
    const partida = l.proximamente ? null : leerPartida(l.guardado);
    let estado;
    if(l.proximamente) estado = '<p class="estado">En preparación</p>';
    else if(partida){
      let txt = 'Partida en curso';
      try{ if(l.progreso) txt = l.progreso(partida); }catch(e){}
      estado = `<p class="estado en-curso">${esc(txt)}</p>`;
    }
    else estado = '<p class="estado">Sin empezar</p>';

    const tapa = `
      <div class="volumen" aria-hidden="true">
        <div class="tapa" style="--c:${esc(l.color || '#2f4a6b')}">
          ${l.portada ? `<img class="portada" src="${esc(l.portada)}" alt="">` : `
          <span class="lomo"></span>
          <div class="marco">
            <span class="emblema">${esc(l.emblema || '✦')}</span>
            <span class="t-titulo">${esc(l.titulo)}</span>
            ${l.subtitulo ? `<span class="t-sub">${esc(l.subtitulo)}</span>` : ''}
          </div>`}
        </div>
      </div>`;
    const ficha = `
      <div class="ficha">
        <h2>${esc(l.titulo)}</h2>
        ${l.genero ? `<p class="genero">${esc(l.genero)}</p>` : ''}
        ${l.resumen ? `<p class="resumen">${esc(l.resumen)}</p>` : ''}
        ${estado}
      </div>`;

    return l.proximamente
      ? `<li style="--i:${i}"><div class="libro inactivo" aria-disabled="true">${tapa}${ficha}</div></li>`
      : `<li style="--i:${i}"><a class="libro" href="${encodeURI(l.carpeta)}/index.html">${tapa}${ficha}</a></li>`;
  }).join('');
}

pintar();
/* Al volver con el botón Atrás, refresca el estado de las partidas */
window.addEventListener('pageshow', e => { if(e.persisted) pintar(); });
</script>
</body>
</html>
